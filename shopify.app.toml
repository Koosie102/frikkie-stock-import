# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "967712365a20b26ba490d896a343e824"
name = "frikkies-stock-importer"
handle = "frikkies-stock-importer"
application_url = "https://frikkie-stock-import-production.up.railway.app/"
embedded = true

[build]
automatically_update_urls_on_dev = true
dev_store_url = ""

[access_scopes]
# Uncheck "Use legacy install flow" in the Dev Dashboard — this app uses standard OAuth.
scopes = "read_products,write_products,read_inventory,write_inventory,read_online_store_navigation,write_online_store_navigation,read_publications,write_publications"

[auth]
redirect_urls = [
  "https://frikkie-stock-import-production.up.railway.app/auth/callback",
  "https://frikkie-stock-import-production.up.railway.app/auth/shopify/callback",
  "https://frikkie-stock-import-production.up.railway.app/api/auth/callback"
]

[webhooks]
api_version = "2024-10"

  [[webhooks.subscriptions]]
  topics = ["app/uninstalled"]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = ["app/scopes_update"]
  uri = "/webhooks/app/scopes_update"

[pos]
embedded = false
